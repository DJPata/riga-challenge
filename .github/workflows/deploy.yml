# Bei jedem Push auf main wird die App automatisch auf Firebase Hosting veröffentlicht.
name: Deploy auf Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versionsstempel schreiben (für den Update-Hinweis in der App)
        run: echo "{\"version\":\"${GITHUB_SHA::7}\",\"built\":\"$(date -u +%FT%TZ)\"}" > public/version.json

      - name: Auf Firebase Hosting veröffentlichen
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BOYS_TRIP_EFCF9 }}
          channelId: live
          projectId: boys-trip-efcf9
